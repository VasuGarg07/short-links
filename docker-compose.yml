services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: vasug
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing, create the .env file as described in the README}
      POSTGRES_DB: short_links_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vasug", "-d", "short_links_db"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vasug:${DB_PASSWORD}@db:5432/short_links_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
